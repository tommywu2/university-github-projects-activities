name: GitHub Projects Automation with README Update

on:
  pull_request:
    types: [closed]

jobs:
  move-issue-to-done:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v2

      - name: Check if PR is merged
        if: github.event.pull_request.merged == true
        run: curl -X POST \
        -H "Authorisation: token ${{ secrets.GITHUB_TOKEN }}" \
        -H "Accept: application/vnd.github.v3+json" \
        -d '{
          "column_id": "PROJECT_COLUMN_ID",
          "content_type": "Issue",
          "content_id": ${{ github.event.issue.id}} #Corrected Syntax
        }' \
        https://api.github.com/projects/columns/PROJECT_COLUMN_ID/cards
